<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyHubSA</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#0f172a,#1d4ed8,#7c3aed,#06b6d4);
  background-size:400% 400%;
  animation:bgMove 15s ease infinite;
  color:white;
}

@keyframes bgMove{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

.hero{
  text-align:center;
  padding:80px 20px;
}

.hero-btn{
  display:inline-block;
  margin-top:20px;
  padding:15px 30px;
  background:#facc15;
  color:#111827;
  text-decoration:none;
  border-radius:50px;
  font-weight:bold;
}

.resource-card{
  background:rgba(255,255,255,.12);
  border-radius:20px;
  padding:20px;
  margin:15px;
}
</style>
</head>
<body> 
<section class="hero">
  <h1>🎓 StudyHubSA</h1>
  <p>South Africa's Smart Study Platform for Grades 4–12</p>
  <a href="#resources" class="hero-btn">Start Learning Free</a>
</section>
  <section id="resources">
  <h2>📚 Study Resources</h2>
  <p>Choose your grade and subject.</p>

  <div class="resources-grid">
<section id="grade4-maths-term1">
<!-- =========================================
     STUDYHUBSA RESOURCE LIBRARY
     GRADES 4–12
========================================= -->

<section id="resources">

  <div class="resources-title">
    <span>📚</span>
    <h2>StudyHubSA Resource Library</h2>
    <p>
      Original learning resources for South African learners.
      Choose your grade and subject to start learning.
    </p>
  </div>

  <!-- GRADES -->
  <div id="gradeButtons" class="grade-buttons"></div>

  <!-- SUBJECTS + RESOURCES -->
  <div id="resourceArea"></div>

</section>


<style>

/* =========================
   RESOURCES
========================= */

#resources {
  padding: 70px 20px;
  max-width: 1200px;
  margin: auto;
}

.resources-title {
  text-align: center;
  margin-bottom: 40px;
}

.resources-title span {
  font-size: 45px;
}

.resources-title h2 {
  font-size: 38px;
  margin: 10px 0;
}

.resources-title p {
  font-size: 17px;
  line-height: 1.6;
}


/* =========================
   GRADE BUTTONS
========================= */

.grade-buttons {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
  margin-bottom: 40px;
}

.grade-btn {
  border: none;
  padding: 13px 20px;
  border-radius: 30px;
  cursor: pointer;
  font-weight: bold;
  font-size: 15px;
  transition: 0.3s;
}

.grade-btn:hover {
  transform: translateY(-4px) scale(1.03);
}

.grade-btn.active {
  transform: scale(1.06);
}


/* =========================
   SUBJECT GRID
========================= */

.subject-grid {
  display: grid;
  grid-template-columns:
    repeat(auto-fit, minmax(230px, 1fr));

  gap: 20px;
  margin-top: 25px;
}

.subject-card {
  padding: 25px;
  border-radius: 22px;

  background: rgba(255,255,255,0.13);

  backdrop-filter: blur(15px);

  border: 1px solid rgba(255,255,255,0.25);

  box-shadow:
    0 12px 35px rgba(0,0,0,0.18);

  transition: 0.3s;
}

.subject-card:hover {
  transform: translateY(-8px);
}

.subject-card h3 {
  font-size: 21px;
  margin-top: 0;
}

.subject-card p {
  line-height: 1.5;
}

.subject-btn {
  width: 100%;
  border: none;
  padding: 12px;
  border-radius: 12px;
  cursor: pointer;
  font-weight: bold;
  margin-top: 10px;
}


/* =========================
   RESOURCE PAGE
========================= */

.resource-page {
  margin-top: 30px;
  padding: 35px;

  border-radius: 25px;

  background: rgba(255,255,255,0.12);

  backdrop-filter: blur(15px);

  border: 1px solid rgba(255,255,255,0.25);

  box-shadow:
    0 15px 40px rgba(0,0,0,0.20);
}

.resource-page h2 {
  margin-top: 0;
  font-size: 30px;
}

.resource-box {
  margin-top: 25px;
  padding: 23px;

  border-radius: 18px;

  background: rgba(255,255,255,0.08);
}

.resource-box h3 {
  margin-top: 0;
}

.resource-box li {
  margin-bottom: 8px;
}

.back-btn {
  border: none;
  padding: 12px 18px;
  border-radius: 12px;
  cursor: pointer;
  font-weight: bold;
  margin-top: 20px;
}

</style>


<script>

/* =========================================
   STUDYHUBSA SUBJECT DATABASE
========================================= */

const studyHubSubjects = {

  "Grade 4": [
    "Mathematics",
    "English",
    "Afrikaans",
    "Natural Sciences",
    "Social Sciences"
  ],

  "Grade 5": [
    "Mathematics",
    "English",
    "Afrikaans",
    "Natural Sciences",
    "Social Sciences"
  ],

  "Grade 6": [
    "Mathematics",
    "English",
    "Afrikaans",
    "Natural Sciences",
    "Social Sciences"
  ],

  "Grade 7": [
    "Mathematics",
    "English",
    "Afrikaans",
    "Natural Sciences",
    "Social Sciences",
    "EMS"
  ],

  "Grade 8": [
    "Mathematics",
    "English",
    "Afrikaans",
    "Natural Sciences",
    "Social Sciences",
    "EMS",
    "Technology"
  ],

  "Grade 9": [
    "Mathematics",
    "English",
    "Afrikaans",
    "Natural Sciences",
    "Social Sciences",
    "EMS",
    "Technology"
  ],

  "Grade 10": [
    "Mathematics",
    "Mathematical Literacy",
    "English",
    "Afrikaans",
    "Physical Sciences",
    "Life Sciences",
    "Accounting",
    "Business Studies",
    "Economics",
    "Geography",
    "History",
    "CAT",
    "Information Technology",
    "Tourism",
    "Agricultural Sciences"
  ],

  "Grade 11": [
    "Mathematics",
    "Mathematical Literacy",
    "English",
    "Afrikaans",
    "Physical Sciences",
    "Life Sciences",
    "Accounting",
    "Business Studies",
    "Economics",
    "Geography",
    "History",
    "CAT",
    "Information Technology",
    "Tourism",
    "Agricultural Sciences"
  ],

  "Grade 12": [
    "Mathematics",
    "Mathematical Literacy",
    "English",
    "Afrikaans",
    "Physical Sciences",
    "Life Sciences",
    "Accounting",
    "Business Studies",
    "Economics",
    "Geography",
    "History",
    "CAT",
    "Information Technology",
    "Tourism",
    "Agricultural Sciences"
  ]

};


/* =========================================
   CREATE GRADE BUTTONS
========================================= */

const gradeButtons =
  document.getElementById("gradeButtons");

const resourceArea =
  document.getElementById("resourceArea");


Object.keys(studyHubSubjects).forEach(
  (grade, index) => {

    const button =
      document.createElement("button");

    button.className = "grade-btn";

    button.innerHTML =
      "🎓 " + grade;

    button.onclick = function () {

      showGrade(grade);

      document
        .querySelectorAll(".grade-btn")
        .forEach(btn =>
          btn.classList.remove("active")
        );

      button.classList.add("active");

    };

    gradeButtons.appendChild(button);

    /* Open Grade 4 automatically */
    if (index === 0) {

      button.classList.add("active");

      showGrade(grade);

    }

  }
);


/* =========================================
   SHOW SUBJECTS
========================================= */

function showGrade(grade) {

  let html = `

    <div class="resource-page">

      <h2>🎓 ${grade} Resources</h2>

      <p>
        Choose a subject below to access
        StudyHubSA's learning resources.
      </p>

      <div class="subject-grid">

  `;


  studyHubSubjects[grade].forEach(
    subject => {

      html += `

        <div class="subject-card">

          <h3>📘 ${subject}</h3>

          <p>
            Study Notes • Worksheets •
            Challenges • Memorandum
          </p>

          <button
            class="subject-btn"
            onclick="openSubject('${grade}', '${subject}')">

            🚀 Start Learning

          </button>

        </div>

      `;

    }
  );


  html += `

      </div>

    </div>

  `;


  resourceArea.innerHTML = html;

}


/* =========================================
   OPEN SUBJECT RESOURCE
========================================= */

function openSubject(grade, subject) {

  resourceArea.innerHTML = `

    <div class="resource-page">

      <h2>
        📚 ${grade} — ${subject}
      </h2>

      <p>
        Welcome to your StudyHubSA
        ${subject} learning resource.
      </p>


      <!-- NOTES -->

      <div class="resource-box">

        <h3>📘 Study Notes</h3>

        <p>
          StudyHubSA original learning notes
          for ${grade} ${subject}.
        </p>

        <h4>Learning Goals</h4>

        <ul>

          <li>
            Understand the key concepts.
          </li>

          <li>
            Learn important terminology.
          </li>

          <li>
            Study examples carefully.
          </li>

          <li>
            Practise applying your knowledge.
          </li>

          <li>
            Review difficult areas.
          </li>

        </ul>

        <h4>💡 Study Tip</h4>

        <p>
          Read the lesson carefully and try
          to explain the main idea in your
          own words.
        </p>

      </div>


      <!-- WORKSHEET -->

      <div class="resource-box">

        <h3>📝 Practice Worksheet</h3>

        <p>
          <strong>Question 1:</strong>
          Write three important facts you
          learned about ${subject}.
        </p>

        <p>
          <strong>Question 2:</strong>
          Explain one important concept
          in your own words.
        </p>

        <p>
          <strong>Question 3:</strong>
          Give one real-life example of
          how ${subject} can be useful.
        </p>

        <p>
          <strong>Question 4:</strong>
          Write five important keywords
          related to ${subject}.
        </p>

        <p>
          <strong>Question 5:</strong>
          Write one question you would
          ask your teacher about this topic.
        </p>

      </div>


      <!-- CHALLENGE -->

      <div class="resource-box">

        <h3>🧠 Challenge Zone</h3>

        <p>
          Imagine you are the teacher!
        </p>

        <p>
          Create a difficult question about
          ${subject} and then write the
          correct answer.
        </p>

        <p>
          ⭐ Bonus: Explain why your answer
          is correct.
        </p>

      </div>


      <!-- MEMORANDUM -->

      <div class="resource-box">

        <h3>✅ Memorandum</h3>

        <p>
          Compare your answers with the
          following guidelines:
        </p>

        <ul>

          <li>
            Answers must be relevant to
            the question.
          </li>

          <li>
            Important terms should be
            used correctly.
          </li>

          <li>
            Explanations should be clear
            and complete.
          </li>

          <li>
            Examples must relate to the
            subject.
          </li>

        </ul>

      </div>


      <!-- COMPLETION -->

      <div class="resource-box">

        <h3>🏆 Well Done!</h3>

        <p>
          You have completed this
          StudyHubSA learning activity.
        </p>

        <p>
          <strong>
            Study Smarter.
            Learn Better.
            Build Your Future. 🚀
          </strong>
        </p>

      </div>


      <button
        class="back-btn"
        onclick="showGrade('${grade}')">

        ← Back to ${grade} Subjects

      </button>

    </div>

  `;


  document
    .getElementById("resources")
    .scrollIntoView({
      behavior: "smooth"
    });

}

</script>
</section>
  </div>
  </body>
</html>
